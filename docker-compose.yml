# Deploy baru (svc.enviroo.tech). Berjalan berdampingan dengan deploy lama
# (enviroo-db, enviroo-app, :5432, :8080), jadi nama project, port host, dan
# network sengaja dibuat berbeda supaya tidak menimpa / tersambung ke yang lama.
name: enviroo-svc

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Hanya dari server sendiri (mis. SSH tunnel). Backend memakai jaringan docker (DB_HOST=db).
    ports:
      - "127.0.0.1:5434:5432"

  app:
    build: .
    restart: always
    depends_on:
      - db
    # Diakses publik lewat nginx (svc.enviroo.tech -> localhost:8081).
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    # Jam container = WIB. Tanpa ini Go memakai UTC, sehingga worker terjadwal
    # (sesi pending jam 20, reminder jam 18) meleset 7 jam.
    environment:
      TZ: Asia/Jakarta
    volumes:
      - ./internal/config:/app/internal/config

networks:
  default:
    name: enviroo-svc-network

volumes:
  postgres_data:
